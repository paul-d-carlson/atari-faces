name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# -o pipefail: a failing `make` must fail its step even when piped to tee.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cc65 and LLVM tools
        run: sudo apt-get update && sudo apt-get install -y cc65 clang-18 llvm-18 zip

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python packages
        run: python -m pip install -r tools/requirements.txt

      - name: Cache third-party tools
        uses: actions/cache@v6
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('mk/deps.mk', 'tools/fetch.sh') }}

      - name: Fetch and build dependencies
        run: make deps

      - name: Build faces.xex and faces.atr
        run: make -j4 all atr | tee build.log

      - name: Run unit tests natively (sanitizers)
        run: make test-host | tee host.log

      - name: Host coverage
        run: |
          make coverage HOST_CC=clang-18 LLVM_PROFDATA=llvm-profdata-18 LLVM_COV=llvm-cov-18 \
            | tee coverage.log

      - name: Run unit tests on the emulated 6502
        run: make test-target | tee target.log

      - name: Run integration test
        run: make test-integration | tee integration.log

      - name: Test tools
        run: make test-tools PYTHON=python

      - name: Summary
        if: always()
        run: |
          {
            echo "### Memory"
            if [ -f build/faces.xex ]; then
              echo "- faces.xex: $(wc -c < build/faces.xex | tr -d ' ') bytes"
            fi
            grep -h 'MEM ' build.log target.log 2>/dev/null | sed 's/^ *MEM *//; s/^/- /' || true
            if [ -f integration.log ]; then
              grep -h 'C stack' integration.log | sed 's/^/- /' || true
            fi
            echo
            echo "### Tests"
            grep -h 'tests passed' host.log target.log 2>/dev/null | sed 's/^/- /' || true
            if [ -f integration.log ]; then
              echo "- mystery faces recognized: $(grep -c '\[PASS\] mystery face' integration.log || true) of 5"
            fi
            if [ -f coverage.log ]; then
              grep -h '^TOTAL' coverage.log | awk '{ print "- host line coverage: " $(NF-3) }' || true
            fi
            if [ -f integration.log ]; then
              echo
              echo "### Timing (emulated 6502)"
              echo '```'
              sed -n '/^Time spent on the math/,/power iterations/p' integration.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: atari-faces
          path: |
            build/faces.xex
            build/faces.atr

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/integration/shots/
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        run: |
          version=$(make -s version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in the Makefile"
            exit 1
          fi

      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65 zip

      - name: Build release archive
        run: make deps && make dist

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" build/atari-faces-*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
